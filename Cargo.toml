[package]
name = "proxypilot"
version = "0.1.0"
description = "Windows local proxy manager for sing-box"
authors = ["ProxyPilot contributors"]
edition = "2021"
rust-version = "1.80"
build = "build.rs"

[dependencies]
directories = "6"
keyring = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
percent-encoding = "2.3"
slint = "1.10"
url = "2.5"

[build-dependencies]
slint-build = "1.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
