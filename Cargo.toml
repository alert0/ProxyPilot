[package]
name = "proxypilot"
version = "0.1.0"
description = "Windows local proxy manager for sing-box"
authors = ["ProxyPilot contributors"]
edition = "2021"
rust-version = "1.80"
build = "build.rs"

[dependencies]
slint = "1.10"

[build-dependencies]
slint-build = "1.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true