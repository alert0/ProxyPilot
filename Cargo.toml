[package]
name = "proxypilot"
version = "0.2.1"
description = "Windows local proxy manager for sing-box"
authors = ["ProxyPilot contributors"]
edition = "2021"
rust-version = "1.92"
build = "build.rs"

[dependencies]
directories = "6"
rfd = "0.15"
keyring = { version = "3.6", features = ["windows-native"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
percent-encoding = "2.3"
slint = "1.10"
url = "2.5"

[build-dependencies]
slint-build = "1.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
