name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo check
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Verify official core integration with synthetic nodes
        run: cargo run --release --locked --example core_acceptance

      - name: Assemble portable package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPilot-windows-x64
          path: dist/*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
